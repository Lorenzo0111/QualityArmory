  crash-help: In case the resourcepack crashes your client, reject the request and use /qa getResourcepack to get the resourcepack.
  download: Download this resourcepack and enable it to see the custom items (Note that it may take some time to load)
  now-bypassing: By issuing this command, you are now added to a whitelist for the resourcepack. You should no longer see the prompt
  now-opted-in: By issuing this command, you have been removed from the whitelist. You will now receive the resourcepack prompt
