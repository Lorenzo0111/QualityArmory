help:
  header: ' Commands:'
  give: '&6/QA give <Item> [player] [amount]:&7 Gives the sender the item specified (guns, ammo, misc.)'
  craft: '&6/QA craft [Item]:&7 Opens the crafting menu.'
  shop: '&6/QA shop: &7Opens the shop menu'
  get-resourcepack: '&6/QA getResourcepack: &7Sends the link to the resourcepack. Disables the resourcepack prompts until /qa sendResourcepack is used'
  send-resourcepack: '&6/QA sendResourcepack: &7Sends the resourcepack prompt. Enables the resourcepack prompt. Enabled by default'
  reload: '&6/QA reload: &7Reloads all values in QA.'
  create-new-ammo: '&6/QA createNewAmmo <name>: &7Creates a new ammo type using the item in your hand as a template'
